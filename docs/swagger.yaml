basePath: /api
definitions:
  handler.NotifyRequest:
    properties:
      id:
        description: 课程ID，必填
        example: 123
        type: integer
    required:
    - id
    type: object
  handler.Response:
    properties:
      code:
        description: 响应码，0表示成功
        example: 0
        type: integer
      message:
        description: 响应消息
        example: success
        type: string
    type: object
  model.Charge:
    properties:
      annual_times:
        type: number
      charge:
        type: number
      charged_time:
        type: string
      coach:
        $ref: '#/definitions/model.Coach'
      coach_id:
        type: integer
      court:
        type: string
      description:
        type: string
      id:
        type: integer
      notified:
        type: integer
      prepaid_card:
        allOf:
        - $ref: '#/definitions/model.PrepaidCard'
        description: 关联关系
      prepaid_card_id:
        description: 外键字段
        type: integer
      times:
        type: number
      worth:
        type: integer
    type: object
  model.Coach:
    properties:
      charges:
        items:
          $ref: '#/definitions/model.Charge'
        type: array
      courses:
        items:
          $ref: '#/definitions/model.Course'
        type: array
      id:
        type: integer
      is_active:
        type: integer
      level:
        type: integer
      name:
        type: string
      number:
        type: string
    type: object
  model.Course:
    properties:
      coach:
        $ref: '#/definitions/model.Coach'
      coach_id:
        type: integer
      course_type:
        description: -2体验课未成单,-1体验课成单,0订场，1班课，2私教
        type: integer
      court:
        allOf:
        - $ref: '#/definitions/model.Court'
        description: 关联关系
      court_id:
        description: 外键字段
        type: integer
      description:
        type: string
      duration:
        type: number
      end_time:
        type: string
      id:
        type: integer
      is_adult:
        description: 1=成人课程, 0=儿童课程
        type: integer
      member:
        items:
          $ref: '#/definitions/model.PrepaidCard'
        type: array
      notified:
        type: integer
      spend:
        items:
          $ref: '#/definitions/model.Spend'
        type: array
      start_time:
        type: string
    type: object
  model.Court:
    properties:
      courses:
        items:
          $ref: '#/definitions/model.Course'
        type: array
      id:
        type: integer
      is_active:
        type: integer
      name:
        type: string
    type: object
  model.PrepaidCard:
    properties:
      adults:
        type: integer
      annual_count:
        type: number
      annual_expire_time:
        type: string
      charges:
        items:
          $ref: '#/definitions/model.Charge'
        type: array
      courses:
        description: 关联关系
        items:
          $ref: '#/definitions/model.Course'
        type: array
      court:
        type: string
      equivalent_balance:
        type: integer
      id:
        type: integer
      name:
        type: string
      number:
        type: string
      rest_charge:
        type: number
      spends:
        items:
          $ref: '#/definitions/model.Spend'
        type: array
      times_count:
        type: number
      times_expire_time:
        type: string
      younths:
        type: integer
    type: object
  model.Spend:
    properties:
      annual_times:
        type: number
      charge:
        description: 消费金额
        type: number
      description:
        description: 注意：保持为float32类型
        type: number
      id:
        type: integer
      quantities:
        type: integer
      times:
        type: number
    type: object
  service.AnalyseData:
    properties:
      analyse:
        type: number
      courses:
        type: number
      deal:
        type: number
      members:
        type: number
      trial:
        type: number
      workTime:
        type: number
    type: object
  service.ChargePage:
    properties:
      content:
        items:
          $ref: '#/definitions/model.Charge'
        type: array
      first:
        type: boolean
      last:
        type: boolean
      number:
        type: integer
      numberOfElements:
        type: integer
      size:
        type: integer
      totalElements:
        type: integer
      totalPages:
        type: integer
    type: object
  service.CoursePage:
    properties:
      content:
        items:
          $ref: '#/definitions/model.Course'
        type: array
      first:
        type: boolean
      last:
        type: boolean
      number:
        type: integer
      numberOfElements:
        type: integer
      size:
        type: integer
      totalElements:
        type: integer
      totalPages:
        type: integer
    type: object
  service.EfficiencyResponse:
    properties:
      analyse:
        items:
          additionalProperties:
            $ref: '#/definitions/service.AnalyseData'
          type: object
        type: array
      revenue:
        items:
          additionalProperties:
            $ref: '#/definitions/service.RevenueData'
          type: object
        type: array
    type: object
  service.RevenueData:
    properties:
      charge:
        type: number
      equival:
        type: number
      spend:
        type: number
    type: object
  service.SpendPage:
    properties:
      content:
        items:
          $ref: '#/definitions/model.Spend'
        type: array
      first:
        type: boolean
      last:
        type: boolean
      number:
        type: integer
      numberOfElements:
        type: integer
      size:
        type: integer
      totalElements:
        type: integer
      totalPages:
        type: integer
    type: object
host: localhost:31168
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: 乐动数据库服务API文档
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Ledong DB API
  version: "1.0"
paths:
  /coach/efficient:
    get:
      consumes:
      - application/json
      description: 根据时间范围统计教练和校区的效率数据
      parameters:
      - description: 开始时间，格式：2006-01-02 15:04:05
        in: query
        name: startTime
        required: true
        type: string
      - description: 结束时间，格式：2006-01-02 15:04:05
        in: query
        name: endTime
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.EfficiencyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 教练效率统计
      tags:
      - 教练
  /course/total:
    get:
      consumes:
      - application/json
      description: 根据开始时间查询课程列表，支持按会员编号过滤和分页
      parameters:
      - description: 开始时间，格式：2006-01-02 15:04:05
        in: query
        name: startTime
        required: true
        type: string
      - description: 会员编号，可选
        in: query
        name: number
        type: string
      - description: 页码，从1开始，默认1
        in: query
        name: pageNum
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.CoursePage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 查询课程列表
      tags:
      - 课程
  /health:
    get:
      description: 检查服务是否正常运行
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 健康检查
      tags:
      - 系统
  /prepaidCard/course/{id}:
    delete:
      consumes:
      - application/json
      description: 删除课程并退还所有会员的消费
      parameters:
      - description: 安全验证头
        in: header
        name: secure
        type: string
      - description: 课程ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 删除课程
      tags:
      - 课程
  /prepaidCard/course/{id}/{member}:
    delete:
      consumes:
      - application/json
      description: 从课程中移除指定会员，并退还消费
      parameters:
      - description: 安全验证头
        in: header
        name: secure
        type: string
      - description: 课程ID
        in: path
        name: id
        required: true
        type: integer
      - description: 会员编号
        in: path
        name: member
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 移除课程成员
      tags:
      - 课程
  /prepaidCard/course/create:
    post:
      consumes:
      - application/json
      description: 创建新课程，支持添加会员和消费记录
      parameters:
      - description: 安全验证头
        in: header
        name: secure
        type: string
      - description: 开始时间
        in: formData
        name: startTime
        required: true
        type: string
      - description: 结束时间
        in: formData
        name: endTime
        required: true
        type: string
      - description: 教练名称
        in: formData
        name: coachName
        required: true
        type: string
      - description: 课程时长
        format: float32
        in: formData
        name: spendingTime
        required: true
        type: number
      - description: 场地名称
        in: formData
        name: courtName
        required: true
        type: string
      - description: 描述
        in: formData
        name: descript
        required: true
        type: string
      - description: 课程类型
        in: formData
        name: courseType
        required: true
        type: integer
      - description: 会员JSON对象
        in: formData
        name: membersObj
        required: true
        type: string
      - description: 是否成人课程
        in: formData
        name: isAdult
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 创建课程
      tags:
      - 课程
  /prepaidCard/course/duplicate:
    post:
      consumes:
      - application/json
      description: 检查课程列表中是否有重复的课程
      parameters:
      - description: 安全验证头
        in: header
        name: secure
        type: string
      - description: 课程参数列表
        in: body
        name: params
        required: true
        schema:
          items:
            items: {}
            type: array
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              items: {}
              type: array
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 课程重复检查
      tags:
      - 课程
  /prepaidCard/course/notify:
    post:
      consumes:
      - application/json
      description: 发送课程通知短信
      parameters:
      - description: 安全验证头
        in: header
        name: secure
        type: string
      - description: 课程ID
        in: formData
        name: courseId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 课程通知
      tags:
      - 课程
  /prepaidCard/course/sm:
    post:
      consumes:
      - application/json
      description: 发送自定义短信
      parameters:
      - description: 安全验证头
        in: header
        name: secure
        type: string
      - description: 手机号
        in: formData
        name: number
        required: true
        type: string
      - collectionFormat: csv
        description: 短信参数
        in: formData
        items:
          type: string
        name: params
        required: true
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 发送课程短信
      tags:
      - 课程
  /prepaidCard/course/trial/{id}:
    post:
      consumes:
      - application/json
      description: 将体验课状态加1（从未成单变为成单）
      parameters:
      - description: 安全验证头
        in: header
        name: secure
        type: string
      - description: 课程ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 更新体验课状态
      tags:
      - 课程
  /prepaidCard/spend:
    get:
      consumes:
      - application/json
      description: 查询消费记录，支持按会员编号过滤
      parameters:
      - description: 会员编号，可选
        in: query
        name: number
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.SpendPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 查询消费记录
      tags:
      - 消费记录
  /sms/notify:
    post:
      consumes:
      - application/json
      description: 按照课程查询用户并发送短信通知
      parameters:
      - description: 通知请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.NotifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 通知课程
      tags:
      - 短信
  /user/:
    get:
      consumes:
      - application/json
      description: 根据会员编号查询单个会员，或查询所有会员
      parameters:
      - description: 会员编号
        in: query
        name: number
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.PrepaidCard'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 查询会员列表或单个会员
      tags:
      - 用户
  /user/charged:
    post:
      consumes:
      - application/json
      description: 为用户充值
      parameters:
      - description: 安全验证头
        in: header
        name: secure
        type: string
      - description: 会员编号
        in: formData
        name: number
        required: true
        type: string
      - description: 充值金额
        format: float32
        in: formData
        name: charged
        type: number
      - description: 充值时间
        in: formData
        name: time
        type: string
      - description: 充值次数
        format: float32
        in: formData
        name: times
        type: number
      - description: 年卡次数
        format: float32
        in: formData
        name: annualTimes
        type: number
      - description: 年卡过期时间
        in: formData
        name: annualExpireTime
        type: string
      - description: 等值
        in: formData
        name: worth
        type: integer
      - description: 场地
        in: formData
        name: court
        required: true
        type: string
      - description: 教练
        in: formData
        name: coach
        required: true
        type: string
      - description: 备注
        in: formData
        name: description
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Charge'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 充值
      tags:
      - 用户
  /user/charged/{number}:
    get:
      consumes:
      - application/json
      description: 根据会员编号查询充值记录
      parameters:
      - description: 会员编号
        in: path
        name: number
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.ChargePage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 查询某个用户的充值记录
      tags:
      - 用户
  /user/charged/coach/{number}:
    get:
      consumes:
      - application/json
      description: 根据教练编号和时间范围查询充值记录
      parameters:
      - description: 教练编号
        in: path
        name: number
        required: true
        type: string
      - description: 开始时间
        in: query
        name: startTime
        required: true
        type: string
      - description: 结束时间
        in: query
        name: endTime
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 查询教练的充值记录
      tags:
      - 用户
  /user/charged/retreat/{id}:
    post:
      consumes:
      - application/json
      description: 根据充值记录ID进行退费
      parameters:
      - description: 安全验证头
        in: header
        name: secure
        type: string
      - description: 充值记录ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 退费
      tags:
      - 用户
  /user/charged/total:
    get:
      consumes:
      - application/json
      description: 查询所有充值记录，支持分页
      parameters:
      - description: 每页数量
        in: query
        name: pageSize
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.ChargePage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 查询所有充值记录
      tags:
      - 用户
  /user/coach:
    get:
      consumes:
      - application/json
      description: 查询所有活跃的教练
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Coach'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 查询教练列表
      tags:
      - 用户
  /user/course/notify:
    post:
      consumes:
      - application/json
      description: 发送课程通知短信
      parameters:
      - description: 安全验证头
        in: header
        name: secure
        type: string
      - description: 课程ID，可选，不传则通知所有未通知的课程
        in: formData
        name: id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 课程通知
      tags:
      - 用户
  /user/court:
    get:
      consumes:
      - application/json
      description: 查询所有场地
      produces:
      - application/json
