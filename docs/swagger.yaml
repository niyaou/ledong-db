basePath: /api
definitions:
  handler.NotifyRequest:
    properties:
      id:
        description: 课程ID，必填
        example: 123
        type: integer
    required:
    - id
    type: object
  handler.Response:
    properties:
      code:
        description: 响应码，0表示成功
        example: 0
        type: integer
      message:
        description: 响应消息
        example: success
        type: string
    type: object
  model.Charge:
    properties:
      annual_times:
        type: number
      charge:
        type: number
      charged_time:
        type: string
      coach:
        $ref: '#/definitions/model.Coach'
      coach_id:
        type: integer
      court:
        type: string
      description:
        type: string
      id:
        type: integer
      notified:
        type: integer
      prepaid_card:
        allOf:
        - $ref: '#/definitions/model.PrepaidCard'
        description: 关联关系
      prepaid_card_id:
        description: 外键字段
        type: integer
      times:
        type: number
      worth:
        type: integer
    type: object
  model.Coach:
    properties:
      charges:
        items:
          $ref: '#/definitions/model.Charge'
        type: array
      courses:
        items:
          $ref: '#/definitions/model.Course'
        type: array
      id:
        type: integer
      is_active:
        type: integer
      level:
        type: integer
      name:
        type: string
      number:
        type: string
    type: object
  model.Course:
    properties:
      coach:
        $ref: '#/definitions/model.Coach'
      coach_id:
        type: integer
      course_type:
        description: -2体验课未成单,-1体验课成单,0订场，1班课，2私教
        type: integer
      court:
        allOf:
        - $ref: '#/definitions/model.Court'
        description: 关联关系
      court_id:
        description: 外键字段
        type: integer
      description:
        type: string
      duration:
        type: number
      end_time:
        type: string
      id:
        type: integer
      is_adult:
        description: 1=成人课程, 0=儿童课程
        type: integer
      member:
        items:
          $ref: '#/definitions/model.PrepaidCard'
        type: array
      notified:
        type: integer
      spend:
        items:
          $ref: '#/definitions/model.Spend'
        type: array
      start_time:
        type: string
    type: object
  model.Court:
    properties:
      courses:
        items:
          $ref: '#/definitions/model.Course'
        type: array
      id:
        type: integer
      is_active:
        type: integer
      name:
        type: string
    type: object
  model.PrepaidCard:
    properties:
      adults:
        type: integer
      annual_count:
        type: number
      annual_expire_time:
        type: string
      charges:
        items:
          $ref: '#/definitions/model.Charge'
        type: array
      courses:
        description: 关联关系
        items:
          $ref: '#/definitions/model.Course'
        type: array
      court:
        type: string
      equivalent_balance:
        type: integer
      id:
        type: integer
      name:
        type: string
      number:
        type: string
      rest_charge:
        type: number
      spends:
        items:
          $ref: '#/definitions/model.Spend'
        type: array
      times_count:
        type: number
      times_expire_time:
        type: string
      younths:
        type: integer
    type: object
  model.Spend:
    properties:
      annual_times:
        type: number
      charge:
        description: 消费金额
        type: number
      description:
        description: 注意：保持为float32类型
        type: number
      id:
        type: integer
      quantities:
        type: integer
      times:
        type: number
    type: object
  service.AnalyseItem:
    properties:
      analyse:
        type: number
      courses:
        type: number
      deal:
        type: number
      key:
        type: string
      members:
        type: number
      trial:
        type: number
      workTime:
        type: number
    type: object
  service.CoursePage:
    properties:
      content:
        items:
          $ref: '#/definitions/model.Course'
        type: array
      first:
        type: boolean
      last:
        type: boolean
      number:
        type: integer
      numberOfElements:
        type: integer
      size:
        type: integer
      totalElements:
        type: integer
      totalPages:
        type: integer
    type: object
  service.EfficiencyResponse:
    properties:
      analyse:
        items:
          $ref: '#/definitions/service.AnalyseItem'
        type: array
      revenue:
        items:
          $ref: '#/definitions/service.RevenueItem'
        type: array
    type: object
  service.RevenueItem:
    properties:
      charge:
        type: number
      equival:
        type: number
      key:
        type: string
      spend:
        type: number
    type: object
host: localhost:31168
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: 乐动数据库服务API文档
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Ledong DB API
  version: "1.0"
paths:
  /coach/efficient:
    get:
      consumes:
      - application/json
      description: 根据时间范围统计教练和校区的效率数据
      parameters:
      - description: 开始时间，格式：2006-01-02 15:04:05
        in: query
        name: startTime
        required: true
        type: string
      - description: 结束时间，格式：2006-01-02 15:04:05
        in: query
        name: endTime
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.EfficiencyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 教练效率统计
      tags:
      - 教练
  /course/total:
    get:
      consumes:
      - application/json
      description: 根据开始时间查询课程列表，支持按会员编号过滤和分页
      parameters:
      - description: 开始时间，格式：2006-01-02 15:04:05
        in: query
        name: startTime
        required: true
        type: string
      - description: 会员编号，可选
        in: query
        name: number
        type: string
      - description: 页码，从1开始，默认1
        in: query
        name: pageNum
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.CoursePage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 查询课程列表
      tags:
      - 课程
  /health:
    get:
      description: 检查服务是否正常运行
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 健康检查
      tags:
      - 系统
  /sms/notify:
    post:
      consumes:
      - application/json
      description: 按照课程查询用户并发送短信通知
      parameters:
      - description: 通知请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.NotifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 通知课程
      tags:
      - 短信
swagger: "2.0"
