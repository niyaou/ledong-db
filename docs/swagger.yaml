basePath: /api
definitions:
  handler.NotifyRequest:
    properties:
      id:
        description: 课程ID，必填
        example: 123
        type: integer
    required:
    - id
    type: object
  handler.Response:
    properties:
      code:
        description: 响应码，0表示成功
        example: 0
        type: integer
      message:
        description: 响应消息
        example: success
        type: string
    type: object
host: localhost:31168
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: 乐动数据库服务API文档
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Ledong DB API
  version: "1.0"
paths:
  /health:
    get:
      description: 检查服务是否正常运行
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 健康检查
      tags:
      - 系统
  /sms/notify:
    post:
      consumes:
      - application/json
      description: 按照课程查询用户并发送短信通知
      parameters:
      - description: 通知请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.NotifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/handler.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/handler.Response'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/handler.Response'
      summary: 通知课程
      tags:
      - 短信
swagger: "2.0"
